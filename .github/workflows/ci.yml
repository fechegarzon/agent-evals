name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest

  evals:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install
        run: uv sync --locked

      # Offline and deterministic: the mock judge needs no API key.
      - name: Run the suite and apply the gate
        run: |
          uv run agent-evals run \
            --suite suites/prequal.yaml \
            --agent examples.toy_agent:respond \
            --judge mock \
            --baseline baselines/prequal.json \
            --out runs/ci

      # The gate must also catch a known-bad change. If this run passes, the gate is broken.
      - name: Gate blocks a regressed agent
        run: |
          set +e
          uv run agent-evals run \
            --suite suites/prequal.yaml \
            --agent examples.toy_agent:respond_v2 \
            --judge mock \
            --baseline baselines/prequal.json \
            --out runs/ci-regressed
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit code 1 from the gate, got $code"
            exit 1
          fi

      - name: Add report to the job summary
        if: always()
        run: |
          if [ -f runs/ci/report.md ]; then cat runs/ci/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: runs/
